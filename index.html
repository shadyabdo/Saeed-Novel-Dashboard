<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة نشر الروايات</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #212121;
            --bg-secondary: #2d2d2d;
            --bg-card: rgba(45, 45, 45, 0.7);
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --accent: #bb86fc;
            --accent-hover: #9965f4;
            --success: #03dac6;
            --error: #cf6679;
            --glass-bg: rgba(45, 45, 45, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: 'Rubik', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        header {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent);
        }

        .nav-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Rubik', sans-serif;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            background: var(--accent);
            color: var(--bg-primary);
        }

        /* Main Content */
        main {
            padding: 40px 0;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 30px;
        }

        /* Sidebar */
        .sidebar {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 24px;
            height: fit-content;
            position: sticky;
            top: 100px;
        }

        .sidebar-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--accent);
        }

        .menu-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--text-secondary);
        }

        .menu-item:hover,
        .menu-item.active {
            background: rgba(187, 134, 252, 0.1);
            color: var(--accent);
        }

        .menu-item i {
            margin-left: 12px;
            font-size: 1.2rem;
        }

        /* Content Area */
        .content-area {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 30px;
        }

        .section-title {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 30px;
            color: var(--text-primary);
        }

        /* Cards */
        .card {
            background: rgba(45, 45, 45, 0.5);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--accent);
        }

        .card-text {
            color: var(--text-secondary);
            margin-bottom: 15px;
        }

        /* Forms */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            padding: 12px 16px;
            background: rgba(45, 45, 45, 0.8);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: 'Rubik', sans-serif;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(187, 134, 252, 0.1);
        }

        .form-textarea {
            min-height: 150px;
            resize: vertical;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-family: 'Rubik', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--accent);
            color: var(--bg-primary);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-success {
            background: var(--success);
            color: var(--bg-primary);
        }

        .btn-danger {
            background: var(--error);
            color: var(--bg-primary);
        }

        .btn-secondary {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Grid for novels */
        .novels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .novel-card {
            background: rgba(45, 45, 45, 0.5);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .novel-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow);
        }

        .novel-cover {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, var(--accent), var(--success));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: var(--bg-primary);
        }

        .novel-info {
            padding: 20px;
        }

        .novel-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .novel-author {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        .novel-stats {
            display: flex;
            gap: 15px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* Chapters List */
        .chapters-list {
            list-style: none;
        }

        .chapter-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid var(--glass-border);
            transition: all 0.3s ease;
        }

        .chapter-item:last-child {
            border-bottom: none;
        }

        .chapter-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .chapter-info {
            flex: 1;
        }

        .chapter-title {
            font-weight: 500;
            margin-bottom: 4px;
        }

        .chapter-date {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .chapter-actions {
            display: flex;
            gap: 8px;
        }

        .btn-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            background: var(--glass-bg);
            color: var(--text-primary);
        }

        .btn-icon:hover {
            background: var(--accent);
            color: var(--bg-primary);
        }

        .btn-icon.delete:hover {
            background: var(--error);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 30px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 1.4rem;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .modal-close:hover {
            color: var(--text-primary);
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(45, 45, 45, 0.5);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Loading */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--glass-border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        /* Responsive */
        @media (max-width: 968px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: static;
                margin-bottom: 20px;
            }

            .novels-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            }
        }

        @media (max-width: 600px) {
            .header-content {
                flex-direction: column;
                gap: 15px;
            }

            .novels-grid {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 1100;
        }

        .toast {
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 16px 20px;
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow);
            animation: slideIn 0.3s ease;
        }

        .toast.success {
            border-color: var(--success);
        }

        .toast.error {
            border-color: var(--error);
        }

        @keyframes slideIn {
            from {
                transform: translateX(-100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo">📚 منصة الروايات</div>
                <button class="nav-btn" id="refreshBtn">🔄 تحديث</button>
            </div>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="dashboard-grid">
                <!-- Sidebar -->
                <aside class="sidebar">
                    <h3 class="sidebar-title">القائمة الرئيسية</h3>
                    <nav>
                        <div class="menu-item active" data-section="dashboard">
                            <span>📊 لوحة التحكم</span>
                        </div>
                        <div class="menu-item" data-section="novels">
                            <span>📖 الروايات</span>
                        </div>
                        <div class="menu-item" data-section="chapters">
                            <span>📝 الفصول</span>
                        </div>
                        <div class="menu-item" data-section="folders">
                            <span>📁 المجلدات</span>
                        </div>
                    </nav>
                </aside>

                <!-- Content Area -->
                <div class="content-area">
                    <!-- Dashboard Section -->
                    <section id="dashboard-section" class="section">
                        <h2 class="section-title">لوحة التحكم</h2>
                        
                        <div class="stats-grid">
                            <div class="stat-card">
                                <div class="stat-number" id="total-novels">0</div>
                                <div class="stat-label">إجمالي الروايات</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-number" id="total-chapters">0</div>
                                <div class="stat-label">إجمالي الفصول</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-number" id="total-folders">0</div>
                                <div class="stat-label">المجلدات</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-number" id="total-views">0</div>
                                <div class="stat-label">المشاهدات</div>
                            </div>
                        </div>

                        <div class="card">
                            <h3 class="card-title">آخر النشاطات</h3>
                            <div id="recent-activity">
                                <div class="empty-state">
                                    <div class="empty-state-icon">📝</div>
                                    <p>لا توجد نشاطات حديثة</p>
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- Novels Section -->
                    <section id="novels-section" class="section hidden">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                            <h2 class="section-title" style="margin-bottom: 0;">الروايات</h2>
                            <button class="btn btn-primary" id="addNovelBtn">
                                <span>➕ إضافة رواية جديدة</span>
                            </button>
                        </div>

                        <div id="novels-container" class="novels-grid">
                            <div class="loading">
                                <div class="spinner"></div>
                            </div>
                        </div>
                    </section>

                    <!-- Chapters Section -->
                    <section id="chapters-section" class="section hidden">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                            <h2 class="section-title" style="margin-bottom: 0;">الفصول</h2>
                            <button class="btn btn-primary" id="addChapterBtn">
                                <span>➕ إضافة فصل جديد</span>
                            </button>
                        </div>

                        <div class="form-group">
                            <label class="form-label">تصفية حسب الرواية</label>
                            <select class="form-select" id="chapterNovelFilter">
                                <option value="">كل الروايات</option>
                            </select>
                        </div>

                        <div id="chapters-container">
                            <ul class="chapters-list" id="chapters-list">
                                <div class="loading">
                                    <div class="spinner"></div>
                                </div>
                            </ul>
                        </div>
                    </section>

                    <!-- Folders Section -->
                    <section id="folders-section" class="section hidden">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                            <h2 class="section-title" style="margin-bottom: 0;">المجلدات</h2>
                            <button class="btn btn-primary" id="addFolderBtn">
                                <span>➕ إضافة مجلد جديد</span>
                            </button>
                        </div>

                        <div id="folders-container" class="novels-grid">
                            <div class="loading">
                                <div class="spinner"></div>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </main>

    <!-- Add Novel Modal -->
    <div class="modal" id="addNovelModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">إضافة رواية جديدة</h3>
                <button class="modal-close" onclick="closeModal('addNovelModal')">&times;</button>
            </div>
            <form id="addNovelForm">
                <div class="form-group">
                    <label class="form-label">عنوان الرواية</label>
                    <input type="text" class="form-input" id="novelTitle" required>
                </div>
                <div class="form-group">
                    <label class="form-label">اسم الكاتب</label>
                    <input type="text" class="form-input" id="novelAuthor" required>
                </div>
                <div class="form-group">
                    <label class="form-label">وصف الرواية</label>
                    <textarea class="form-textarea" id="novelDescription" required></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">التصنيف</label>
                    <select class="form-select" id="novelGenre">
                        <option value="romance">رومانسي</option>
                        <option value="action">أكشن</option>
                        <option value="fantasy">فانتازيا</option>
                        <option value="scifi">خيال علمي</option>
                        <option value="mystery">غموض</option>
                        <option value="horror">رعب</option>
                        <option value="drama">دراما</option>
                        <option value="comedy">كوميدي</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">حالة النشر</label>
                    <select class="form-select" id="novelStatus">
                        <option value="ongoing">مستمرة</option>
                        <option value="completed">مكتملة</option>
                        <option value="hiatus">متوقفة مؤقتاً</option>
                    </select>
                </div>
                <div style="display: flex; gap: 10px; justify-content: flex-end;">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('addNovelModal')">إلغاء</button>
                    <button type="submit" class="btn btn-primary">حفظ الرواية</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Add Chapter Modal -->
    <div class="modal" id="addChapterModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">إضافة فصل جديد</h3>
                <button class="modal-close" onclick="closeModal('addChapterModal')">&times;</button>
            </div>
            <form id="addChapterForm">
                <div class="form-group">
                    <label class="form-label">اختر الرواية</label>
                    <select class="form-select" id="chapterNovel" required>
                        <option value="">اختر رواية...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">عنوان الفصل</label>
                    <input type="text" class="form-input" id="chapterTitle" required>
                </div>
                <div class="form-group">
                    <label class="form-label">رقم الفصل</label>
                    <input type="number" class="form-input" id="chapterNumber" min="1" required>
                </div>
                <div class="form-group">
                    <label class="form-label">المجلد (اختياري)</label>
                    <select class="form-select" id="chapterFolder">
                        <option value="">بدون مجلد</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">محتوى الفصل</label>
                    <textarea class="form-textarea" id="chapterContent" style="min-height: 300px;" required></textarea>
                </div>
                <div style="display: flex; gap: 10px; justify-content: flex-end;">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('addChapterModal')">إلغاء</button>
                    <button type="submit" class="btn btn-primary">نشر الفصل</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Add Folder Modal -->
    <div class="modal" id="addFolderModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">إضافة مجلد جديد</h3>
                <button class="modal-close" onclick="closeModal('addFolderModal')">&times;</button>
            </div>
            <form id="addFolderForm">
                <div class="form-group">
                    <label class="form-label">اسم المجلد</label>
                    <input type="text" class="form-input" id="folderName" required>
                </div>
                <div class="form-group">
                    <label class="form-label">وصف المجلد</label>
                    <textarea class="form-textarea" id="folderDescription" style="min-height: 100px;"></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">ترتيب المجلد</label>
                    <input type="number" class="form-input" id="folderOrder" min="1" value="1">
                </div>
                <div style="display: flex; gap: 10px; justify-content: flex-end;">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('addFolderModal')">إلغاء</button>
                    <button type="submit" class="btn btn-primary">حفظ المجلد</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script type="module">
        // Import Firebase
        import { initializeApp } from "firebase/app";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, orderBy, where, Timestamp } from "firebase/firestore";

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCa7YMcRNo4hDzYdsppl21Tw7_2zrd5fXU",
            authDomain: "glass-approach-376912.firebaseapp.com",
            projectId: "glass-approach-376912",
            storageBucket: "glass-approach-376912.firebasestorage.app",
            messagingSenderId: "833125877863",
            appId: "1:833125877863:web:c178bb4bc0a021f1c76cc2"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Collections
        const novelsCollection = collection(db, 'novels');
        const chaptersCollection = collection(db, 'chapters');
        const foldersCollection = collection(db, 'folders');

        // Global state
        let novels = [];
        let chapters = [];
        let folders = [];

        // Utility functions
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <span>${type === 'success' ? '✅' : '❌'}</span>
                <span>${message}</span>
            `;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'slideIn 0.3s ease reverse';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        function openModal(modalId) {
            document.getElementById(modalId).classList.add('active');
        }

        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(section => {
                section.classList.add('hidden');
            });
            document.getElementById(`${sectionId}-section`).classList.remove('hidden');
            
            document.querySelectorAll('.menu-item').forEach(item => {
                item.classList.remove('active');
            });
            document.querySelector(`[data-section="${sectionId}"]`).classList.add('active');
        }

        // Load data from Firestore
        async function loadNovels() {
            try {
                const snapshot = await getDocs(query(novelsCollection, orderBy('createdAt', 'desc')));
                novels = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderNovels();
                updateStats();
                populateNovelSelects();
            } catch (error) {
                console.error('Error loading novels:', error);
                showToast('فشل تحميل الروايات', 'error');
            }
        }

        async function loadChapters() {
            try {
                const snapshot = await getDocs(query(chaptersCollection, orderBy('createdAt', 'desc')));
                chapters = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderChapters();
                updateStats();
            } catch (error) {
                console.error('Error loading chapters:', error);
                showToast('فشل تحميل الفصول', 'error');
            }
        }

        async function loadFolders() {
            try {
                const snapshot = await getDocs(query(foldersCollection, orderBy('order', 'asc')));
                folders = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderFolders();
                updateStats();
                populateFolderSelect();
            } catch (error) {
                console.error('Error loading folders:', error);
                showToast('فشل تحميل المجلدات', 'error');
            }
        }

        // Render functions
        function renderNovels() {
            const container = document.getElementById('novels-container');
            
            if (novels.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📚</div>
                        <p>لا توجد روايات بعد</p>
                        <p style="margin-top: 10px;">ابدأ بإضافة روايتك الأولى!</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = novels.map(novel => `
                <div class="novel-card">
                    <div class="novel-cover">📖</div>
                    <div class="novel-info">
                        <h3 class="novel-title">${novel.title}</h3>
                        <p class="novel-author">✍️ ${novel.author}</p>
                        <p class="card-text" style="font-size: 0.9rem;">${novel.description?.substring(0, 100) || ''}...</p>
                        <div class="novel-stats">
                            <span>📊 ${getNovelChapterCount(novel.id)} فصل</span>
                            <span>👁️ ${novel.views || 0}</span>
                        </div>
                        <div style="margin-top: 15px; display: flex; gap: 8px;">
                            <button class="btn-icon" onclick="window.editNovel('${novel.id}')" title="تعديل">✏️</button>
                            <button class="btn-icon delete" onclick="window.deleteNovel('${novel.id}')" title="حذف">🗑️</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderChapters() {
            const container = document.getElementById('chapters-list');
            const filterNovelId = document.getElementById('chapterNovelFilter').value;
            
            let filteredChapters = chapters;
            if (filterNovelId) {
                filteredChapters = chapters.filter(ch => ch.novelId === filterNovelId);
            }

            if (filteredChapters.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📝</div>
                        <p>لا توجد فصول بعد</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filteredChapters.map(chapter => {
                const novel = novels.find(n => n.id === chapter.novelId);
                return `
                    <li class="chapter-item">
                        <div class="chapter-info">
                            <div class="chapter-title">الفصل ${chapter.number}: ${chapter.title}</div>
                            <div class="chapter-date">${novel ? novel.title : 'غير معروف'} • ${formatDate(chapter.createdAt)}</div>
                        </div>
                        <div class="chapter-actions">
                            <button class="btn-icon" onclick="window.viewChapter('${chapter.id}')" title="عرض">👁️</button>
                            <button class="btn-icon" onclick="window.editChapter('${chapter.id}')" title="تعديل">✏️</button>
                            <button class="btn-icon delete" onclick="window.deleteChapter('${chapter.id}')" title="حذف">🗑️</button>
                        </div>
                    </li>
                `;
            }).join('');
        }

        function renderFolders() {
            const container = document.getElementById('folders-container');
            
            if (folders.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📁</div>
                        <p>لا توجد مجلدات بعد</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = folders.map(folder => `
                <div class="card">
                    <h3 class="card-title">📁 ${folder.name}</h3>
                    <p class="card-text">${folder.description || 'لا يوجد وصف'}</p>
                    <div class="novel-stats">
                        <span>📊 ${getFolderChapterCount(folder.id)} فصل</span>
                    </div>
                    <div style="margin-top: 15px; display: flex; gap: 8px;">
                        <button class="btn-icon" onclick="window.editFolder('${folder.id}')" title="تعديل">✏️</button>
                        <button class="btn-icon delete" onclick="window.deleteFolder('${folder.id}')" title="حذف">🗑️</button>
                    </div>
                </div>
            `).join('');
        }

        function updateStats() {
            document.getElementById('total-novels').textContent = novels.length;
            document.getElementById('total-chapters').textContent = chapters.length;
            document.getElementById('total-folders').textContent = folders.length;
            document.getElementById('total-views').textContent = novels.reduce((sum, novel) => sum + (novel.views || 0), 0);
        }

        function populateNovelSelects() {
            const selects = ['chapterNovel', 'chapterNovelFilter'];
            selects.forEach(selectId => {
                const select = document.getElementById(selectId);
                const currentValue = select.value;
                select.innerHTML = selectId === 'chapterNovelFilter' 
                    ? '<option value="">كل الروايات</option>'
                    : '<option value="">اختر رواية...</option>';
                
                novels.forEach(novel => {
                    const option = document.createElement('option');
                    option.value = novel.id;
                    option.textContent = novel.title;
                    select.appendChild(option);
                });
                
                select.value = currentValue;
            });
        }

        function populateFolderSelect() {
            const select = document.getElementById('chapterFolder');
            const currentValue = select.value;
            select.innerHTML = '<option value="">بدون مجلد</option>';
            
            folders.forEach(folder => {
                const option = document.createElement('option');
                option.value = folder.id;
                option.textContent = folder.name;
                select.appendChild(option);
            });
            
            select.value = currentValue;
        }

        // Helper functions
        function getNovelChapterCount(novelId) {
            return chapters.filter(ch => ch.novelId === novelId).length;
        }

        function getFolderChapterCount(folderId) {
            return chapters.filter(ch => ch.folderId === folderId).length;
        }

        function formatDate(timestamp) {
            if (!timestamp) return '';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return new Intl.DateTimeFormat('ar-EG', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            }).format(date);
        }

        // Event handlers
        document.getElementById('addNovelBtn').addEventListener('click', () => openModal('addNovelModal'));
        document.getElementById('addChapterBtn').addEventListener('click', () => openModal('addChapterModal'));
        document.getElementById('addFolderBtn').addEventListener('click', () => openModal('addFolderModal'));

        document.getElementById('addNovelForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            try {
                await addDoc(novelsCollection, {
                    title: document.getElementById('novelTitle').value,
                    author: document.getElementById('novelAuthor').value,
                    description: document.getElementById('novelDescription').value,
                    genre: document.getElementById('novelGenre').value,
                    status: document.getElementById('novelStatus').value,
                    views: 0,
                    createdAt: Timestamp.now(),
                    updatedAt: Timestamp.now()
                });
                
                showToast('تم إضافة الرواية بنجاح!');
                closeModal('addNovelModal');
                document.getElementById('addNovelForm').reset();
                await loadNovels();
            } catch (error) {
                console.error('Error adding novel:', error);
                showToast('فشل إضافة الرواية', 'error');
            }
        });

        document.getElementById('addChapterForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            try {
                await addDoc(chaptersCollection, {
                    novelId: document.getElementById('chapterNovel').value,
                    title: document.getElementById('chapterTitle').value,
                    number: parseInt(document.getElementById('chapterNumber').value),
                    folderId: document.getElementById('chapterFolder').value || null,
                    content: document.getElementById('chapterContent').value,
                    views: 0,
                    createdAt: Timestamp.now(),
                    updatedAt: Timestamp.now()
                });
                
                showToast('تم نشر الفصل بنجاح!');
                closeModal('addChapterModal');
                document.getElementById('addChapterForm').reset();
                await loadChapters();
            } catch (error) {
                console.error('Error adding chapter:', error);
                showToast('فشل نشر الفصل', 'error');
            }
        });

        document.getElementById('addFolderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            try {
                await addDoc(foldersCollection, {
                    name: document.getElementById('folderName').value,
                    description: document.getElementById('folderDescription').value,
                    order: parseInt(document.getElementById('folderOrder').value),
                    createdAt: Timestamp.now(),
                    updatedAt: Timestamp.now()
                });
                
                showToast('تم إنشاء المجلد بنجاح!');
                closeModal('addFolderModal');
                document.getElementById('addFolderForm').reset();
                await loadFolders();
            } catch (error) {
                console.error('Error adding folder:', error);
                showToast('فشل إنشاء المجلد', 'error');
            }
        });

        document.getElementById('chapterNovelFilter').addEventListener('change', renderChapters);

        document.getElementById('refreshBtn').addEventListener('click', async () => {
            showToast('جاري التحديث...');
            await Promise.all([loadNovels(), loadChapters(), loadFolders()]);
            showToast('تم التحديث بنجاح!');
        });

        // Navigation
        document.querySelectorAll('.menu-item').forEach(item => {
            item.addEventListener('click', () => {
                const section = item.dataset.section;
                showSection(section);
            });
        });

        // Global functions for buttons
        window.editNovel = async (id) => {
            showToast('ميزة التعديل قيد التطوير', 'error');
        };

        window.deleteNovel = async (id) => {
            if (confirm('هل أنت متأكد من حذف هذه الرواية؟ سيتم حذف جميع فصولها أيضاً!')) {
                try {
                    await deleteDoc(doc(db, 'novels', id));
                    showToast('تم حذف الرواية بنجاح!');
                    await loadNovels();
                } catch (error) {
                    console.error('Error deleting novel:', error);
                    showToast('فشل حذف الرواية', 'error');
                }
            }
        };

        window.viewChapter = async (id) => {
            const chapter = chapters.find(ch => ch.id === id);
            if (chapter) {
                alert(`الفصل ${chapter.number}: ${chapter.title}\n\n${chapter.content.substring(0, 500)}...`);
            }
        };

        window.editChapter = async (id) => {
            showToast('ميزة التعديل قيد التطوير', 'error');
        };

        window.deleteChapter = async (id) => {
            if (confirm('هل أنت متأكد من حذف هذا الفصل؟')) {
                try {
                    await deleteDoc(doc(db, 'chapters', id));
                    showToast('تم حذف الفصل بنجاح!');
                    await loadChapters();
                } catch (error) {
                    console.error('Error deleting chapter:', error);
                    showToast('فشل حذف الفصل', 'error');
                }
            }
        };

        window.editFolder = async (id) => {
            showToast('ميزة التعديل قيد التطوير', 'error');
        };

        window.deleteFolder = async (id) => {
            if (confirm('هل أنت متأكد من حذف هذا المجلد؟')) {
                try {
                    await deleteDoc(doc(db, 'folders', id));
                    showToast('تم حذف المجلد بنجاح!');
                    await loadFolders();
                } catch (error) {
                    console.error('Error deleting folder:', error);
                    showToast('فشل حذف المجلد', 'error');
                }
            }
        };

        // Initialize app
        async function init() {
            try {
                await Promise.all([loadNovels(), loadChapters(), loadFolders()]);
                showToast('تم تحميل البيانات بنجاح!');
            } catch (error) {
                console.error('Error initializing app:', error);
                showToast('فشل تحميل البيانات', 'error');
            }
        }

        init();
    </script>
</body>
</html>
